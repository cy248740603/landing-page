<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设备管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #f5f6fa;
      padding: 20px;
    }
    .container { max-width: 720px; margin: 0 auto; }

    h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 24px; }

    .section {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .section h2 {
      font-size: 17px;
      color: #1a1a2e;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: monospace;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { outline: none; border-color: #667eea; }
    textarea { resize: vertical; min-height: 80px; }

    .row { display: flex; gap: 12px; margin-bottom: 12px; }
    .row > div { flex: 1; }
    .mb { margin-bottom: 12px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #667eea; color: #fff; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-sm { padding: 6px 14px; font-size: 13px; }

    .hint { font-size: 12px; color: #999; margin-top: 4px; }

    /* 链接结果 */
    .result-list {
      max-height: 300px;
      overflow-y: auto;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      margin-top: 12px;
    }
    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #f5f5f5;
      font-size: 13px;
    }
    .result-item:last-child { border-bottom: none; }
    .result-mac { font-family: monospace; color: #333; min-width: 140px; }
    .result-link {
      font-family: monospace;
      color: #667eea;
      font-size: 12px;
      word-break: break-all;
      flex: 1;
      margin: 0 12px;
    }
    .result-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* 图片上传 */
    .upload-area {
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: #999;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 12px;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: #667eea;
      background: #f8f9ff;
    }
    .upload-area input { display: none; }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .preview-card {
      background: #f9f9f9;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .preview-card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .preview-card .name {
      font-size: 12px;
      font-family: monospace;
      color: #333;
      word-break: break-all;
    }
    .preview-card .status {
      font-size: 11px;
      margin-top: 4px;
    }
    .status-ok { color: #27ae60; }
    .status-err { color: #e74c3c; }
    .status-wait { color: #999; }

    /* R2 配置折叠 */
    .r2-config { margin-top: 12px; }
    .r2-toggle {
      font-size: 13px;
      color: #667eea;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }
    .r2-toggle:hover { text-decoration: underline; }
    .r2-fields { display: none; margin-top: 12px; }
    .r2-fields.show { display: block; }

    .actions-bar {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
      z-index: 1000;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-ok { background: #27ae60; }
    .toast-err { background: #e74c3c; }

    .empty { color: #ccc; font-size: 14px; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 设备管理</h1>

    <!-- 第1步：输入 MAC -->
    <div class="section">
      <h2>① 输入设备 MAC</h2>
      <div class="mb">
        <label>单个 MAC 地址</label>
        <input type="text" id="single-mac" placeholder="98:DA:B0:10:51:33">
      </div>
      <div class="mb">
        <label>批量 MAC（每行一个）</label>
        <textarea id="batch-mac" placeholder="98:DA:B0:10:51:33&#10;98:DA:B0:10:51:34&#10;98:DA:B0:10:51:35"></textarea>
      </div>
      <button class="btn btn-primary" onclick="generateLinks()">生成链接</button>
    </div>

    <!-- 第2步：链接结果 -->
    <div class="section" id="links-section" style="display:none">
      <h2>② 生成的链接</h2>
      <p class="hint">链接中的 MAC 已编码，不会在 URL 中明文显示</p>
      <div class="result-list" id="links-list"></div>
      <div class="actions-bar">
        <button class="btn btn-secondary btn-sm" onclick="copyAllLinks()">📋 复制全部链接</button>
        <button class="btn btn-secondary btn-sm" onclick="exportCSV()">📥 导出 CSV</button>
      </div>
    </div>

    <!-- 查询已有图片 -->
    <div class="section">
      <h2>📦 已有小程序码图片</h2>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
        <button class="btn btn-primary btn-sm" onclick="listR2Files()">查询全部</button>
        <span style="color:#999;font-size:13px">或</span>
        <input type="text" id="query-mac" placeholder="输入 MAC 查询单个" style="width:180px;padding:6px 10px;font-size:13px">
        <button class="btn btn-secondary btn-sm" onclick="querySingleMac()">查询</button>
      </div>
      <div id="r2-list-status" class="hint" style="margin-top:8px"></div>
      <div id="single-mac-result" style="display:none;margin-top:10px"></div>
      <div class="result-list" id="r2-file-list" style="display:none"></div>
      <div class="actions-bar" id="r2-list-actions" style="display:none">
        <button class="btn btn-secondary btn-sm" onclick="copyAllMacs()">📋 复制全部 MAC</button>
        <button class="btn btn-secondary btn-sm" onclick="exportMacsCSV()">📥 导出 CSV</button>
      </div>
    </div>

    <!-- 第3步：上传小程序码 -->
    <div class="section">
      <h2>③ 上传小程序码图片</h2>
      <p class="hint">文件名需包含 MAC 地址（如 <code>98_DA_B0_10_51_33.jpg</code>），系统自动识别</p>

      <div class="upload-area" id="upload-area">
        <div>📁 点击选择或拖拽图片到这里</div>
        <div style="font-size:12px; margin-top:8px">支持 jpg / png，可多选</div>
        <input type="file" id="file-input" multiple accept="image/*">
      </div>

      <div class="preview-grid" id="preview-grid"></div>

      <div class="r2-config">
        <button class="r2-toggle" onclick="toggleR2()">⚙️ R2 存储配置</button>
        <div class="r2-fields" id="r2-fields">
          <div class="row">
            <div>
              <label>Account ID</label>
              <input type="text" id="r2-account" placeholder="xxxxx">
            </div>
          </div>
          <div class="row">
            <div>
              <label>Access Key ID</label>
              <input type="text" id="r2-access-key">
            </div>
            <div>
              <label>Secret Access Key</label>
              <input type="text" id="r2-secret-key">
            </div>
          </div>
          <div class="row">
            <div>
              <label>Bucket 名称</label>
              <input type="text" id="r2-bucket" placeholder="my-bucket">
            </div>
            <div>
              <label>Public URL</label>
              <input type="text" id="r2-public-url" placeholder="https://pub-xxx.r2.dev">
            </div>
          </div>
          <div class="row">
            <div>
              <label>Cloudflare API Token</label>
              <input type="text" id="r2-cf-token" placeholder="cfat_xxx（用于查询文件列表）">
            </div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="saveR2Config()" style="margin-top:8px">保存配置</button>
        </div>
      </div>

      <div class="actions-bar">
        <button class="btn btn-success" onclick="uploadAll()">☁️ 上传到 R2</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============ MAC 编解码 ============
    function encodeMac(mac) {
      const reversed = mac.split("").reverse().join("");
      return btoa(reversed).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodeMac(encoded) {
      let s = encoded.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      return atob(s).split("").reverse().join("");
    }

    // 标准化 MAC 格式：统一为大写冒号分隔
    function normalizeMac(raw) {
      let mac = raw.trim().toUpperCase();
      // 支持 98DAB0105133 → 98:DA:B0:10:51:33
      if (/^[0-9A-F]{12}$/.test(mac)) {
        mac = mac.match(/.{2}/g).join(":");
      }
      // 支持 98-DA-B0-10-51-33 → 98:DA:B0:10:51:33
      mac = mac.replace(/-/g, ":");
      return mac;
    }

    function isValidMac(mac) {
      return /^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(mac);
    }

    // ============ 生成链接 ============
    const BASE_URL = "https://cy248740603.github.io/landing-page/index.html";

    let currentLinks = []; // { mac, url, encoded }

    function generateLinks() {
      const list = [];
      const single = document.getElementById("single-mac").value;
      const batch = document.getElementById("batch-mac").value;

      if (single.trim()) list.push(single);
      if (batch.trim()) list.push(...batch.split("\n"));

      const results = [];
      const errors = [];

      list.forEach(raw => {
        if (!raw.trim()) return;
        const mac = normalizeMac(raw);
        if (!isValidMac(mac)) {
          errors.push(raw.trim());
          return;
        }
        const encoded = encodeMac(mac);
        results.push({ mac, encoded, url: BASE_URL + "?d=" + encoded });
      });

      if (errors.length) {
        showToast("无效 MAC: " + errors.join(", "), true);
      }

      if (results.length === 0) return;

      currentLinks = results;
      renderLinks();
      document.getElementById("links-section").style.display = "";
    }

    function renderLinks() {
      const container = document.getElementById("links-list");
      container.innerHTML = currentLinks.map((item, i) => `
        <div class="result-item">
          <span class="result-mac">${item.mac}</span>
          <span class="result-link">${item.url}</span>
          <div class="result-actions">
            <button class="btn btn-secondary btn-sm" onclick="copyLink(${i})">复制</button>
          </div>
        </div>
      `).join("");
    }

    function copyLink(i) {
      navigator.clipboard.writeText(currentLinks[i].url);
      showToast("已复制链接");
    }

    function copyAllLinks() {
      const text = currentLinks.map(l => l.mac + "\t" + l.url).join("\n");
      navigator.clipboard.writeText(text);
      showToast("已复制全部链接");
    }

    function exportCSV() {
      let csv = "MAC,编码,链接\n";
      currentLinks.forEach(l => {
        csv += `"${l.mac}","${l.encoded}","${l.url}"\n`;
      });
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "设备链接.csv";
      a.click();
    }

    // ============ 图片上传 ============
    let pendingFiles = []; // { file, mac, filename }

    const uploadArea = document.getElementById("upload-area");
    const fileInput = document.getElementById("file-input");

    uploadArea.addEventListener("click", () => fileInput.click());
    uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
    uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
    uploadArea.addEventListener("drop", e => {
      e.preventDefault();
      uploadArea.classList.remove("dragover");
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", e => handleFiles(e.target.files));

    function handleFiles(files) {
      pendingFiles = [];
      const grid = document.getElementById("preview-grid");
      grid.innerHTML = "";

      Array.from(files).forEach(file => {
        // 从文件名提取 MAC：98_DA_B0_10_51_33.jpg → 98:DA:B0:10:51:33
        const nameMatch = file.name.match(/([0-9A-Fa-f]{2}[_:-]){5}[0-9A-Fa-f]{2}/);
        let mac = "";
        if (nameMatch) {
          mac = normalizeMac(nameMatch[0].replace(/_/g, ":"));
        }

        const entry = { file, mac, filename: file.name, status: "等待上传" };
        pendingFiles.push(entry);

        const reader = new FileReader();
        reader.onload = e => {
          const card = document.createElement("div");
          card.className = "preview-card";
          card.id = "preview-" + (pendingFiles.length - 1);
          card.innerHTML = `
            <img src="${e.target.result}" alt="${file.name}">
            <div class="name">${file.name}</div>
            <div class="name" style="color:#667eea">${mac || "未识别 MAC"}</div>
            <div class="status status-wait">等待上传</div>
          `;
          grid.appendChild(card);
        };
        reader.readAsDataURL(file);
      });
    }

    // ============ R2 上传 ============
    function toggleR2() {
      document.getElementById("r2-fields").classList.toggle("show");
    }

    function getR2Config() {
      return {
        accountId: document.getElementById("r2-account").value.trim(),
        accessKeyId: document.getElementById("r2-access-key").value.trim(),
        secretAccessKey: document.getElementById("r2-secret-key").value.trim(),
        bucket: document.getElementById("r2-bucket").value.trim(),
        publicUrl: document.getElementById("r2-public-url").value.trim().replace(/\/$/, ""),
      };
    }

    function saveR2Config() {
      const cfg = getR2Config();
      localStorage.setItem("r2-config", JSON.stringify(cfg));
      showToast("R2 配置已保存");
    }

    function loadR2Config() {
      const defaults = {
        accountId: "b81e53b36b8866c1bd63dcf8368bd5e2",
        accessKeyId: "bb72851a395acb2b274443d523fc4d92",
        secretAccessKey: "7ece1665f2867743580d804021d557b771e593944f6a95cfb92f5f18420ff51f",
        bucket: "landing-page-qr",
        publicUrl: "https://pub-eedaa9e3aef043f7a662a6870ce08bc0.r2.dev"
      };
      let cfg = {};
      try { cfg = JSON.parse(localStorage.getItem("r2-config") || "{}" ); } catch(e) {}
      document.getElementById("r2-account").value = cfg.accountId || defaults.accountId;
      document.getElementById("r2-access-key").value = cfg.accessKeyId || defaults.accessKeyId;
      document.getElementById("r2-secret-key").value = cfg.secretAccessKey || defaults.secretAccessKey;
      document.getElementById("r2-bucket").value = cfg.bucket || defaults.bucket;
      document.getElementById("r2-public-url").value = cfg.publicUrl || defaults.publicUrl;
      document.getElementById("r2-cf-token").value = cfg.cfToken || "";
      if (!cfg.accountId) saveR2Config();
    }
    loadR2Config();

    // AWS S3 V4 签名
    async function sha256(data) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(data));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function hmacSha256(key, data) {
      const k = await crypto.subtle.importKey("raw", key, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
      return new Uint8Array(await crypto.subtle.sign("HMAC", k, new TextEncoder().encode(data)));
    }

    async function uploadToR2(file, objectKey) {
      const cfg = getR2Config();
      const host = `${cfg.accountId}.r2.cloudflarestorage.com`;
      const endpoint = `https://${host}`;
      const now = new Date();
      const dateStr = now.toISOString().replace(/[:-]|\.\d{3}/g, "");
      const dateShort = dateStr.slice(0, 8);
      const region = "auto";
      const service = "s3";

      const payloadBuf = await file.arrayBuffer();
      const payloadHash = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", payloadBuf)))
        .map(b => b.toString(16).padStart(2, "0")).join("");

      const canonicalUri = "/" + encodeURIComponent(objectKey).replace(/%2F/g, "/");
      const canonicalQueryString = "";
      const contentType = file.type || "application/octet-stream";

      const signedHeaders = "content-type;host;x-amz-content-sha256;x-amz-date";
      const canonicalHeaders = `content-type:${contentType}\nhost:${host}\nx-amz-content-sha256:${payloadHash}\nx-amz-date:${dateStr}\n`;

      const canonicalRequest = [
        "PUT", canonicalUri, canonicalQueryString, canonicalHeaders, signedHeaders, payloadHash
      ].join("\n");

      const scope = `${dateShort}/${region}/${service}/aws4_request`;
      const stringToSign = [
        "AWS4-HMAC-SHA256", dateStr, scope, await sha256(canonicalRequest)
      ].join("\n");

      const kDate = await hmacSha256(new TextEncoder().encode("AWS4" + cfg.secretAccessKey), dateShort);
      const kRegion = await hmacSha256(kDate, region);
      const kService = await hmacSha256(kRegion, service);
      const kSigning = await hmacSha256(kService, "aws4_request");
      const signature = Array.from(await hmacSha256(kSigning, stringToSign))
        .map(b => b.toString(16).padStart(2, "0")).join("");

      const authorization = `AWS4-HMAC-SHA256 Credential=${cfg.accessKeyId}/${scope}, SignedHeaders=${signedHeaders}, Signature=${signature}`;

      const url = `${endpoint}/${cfg.bucket}/${objectKey}`;
      const resp = await fetch(url, {
        method: "PUT",
        headers: {
          "Content-Type": contentType,
          "x-amz-content-sha256": payloadHash,
          "x-amz-date": dateStr,
          "Authorization": authorization,
        },
        body: payloadBuf,
      });

      if (!resp.ok) {
        const text = await resp.text();
        throw new Error(`R2 上传失败 (${resp.status}): ${text}`);
      }
      return cfg.publicUrl + "/" + objectKey;
    }

    // ============ 单个 MAC 查询 ============
    async function querySingleMac() {
      const input = document.getElementById("query-mac").value.trim();
      if (!input) { showToast("请输入 MAC 地址", true); return; }
      const mac = normalizeMac(input);
      if (!isValidMac(mac)) { showToast("无效 MAC: " + input, true); return; }

      const cfg = getR2Config();
      const key = mac.replace(/:/g, "_") + ".jpg";
      const url = cfg.publicUrl + "/" + key;
      const resultEl = document.getElementById("single-mac-result");
      resultEl.style.display = "";

      // 先检查图片是否存在
      try {
        const resp = await fetch(url, { method: "HEAD" });
        if (resp.ok) {
          resultEl.innerHTML = `
            <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:12px;display:flex;align-items:center;gap:12px">
              <img src="${url}" style="width:80px;height:80px;object-fit:cover;border-radius:8px">
              <div>
                <div style="font-weight:600;color:#16a34a">✓ 图片存在</div>
                <div style="font-family:monospace;font-size:13px;margin-top:4px">${mac}</div>
                <div style="font-size:12px;color:#666;margin-top:2px">${key}</div>
                <a href="${url}" target="_blank" style="font-size:12px;color:#667eea">查看大图</a>
              </div>
            </div>`;
        } else {
          resultEl.innerHTML = `
            <div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:12px">
              <div style="font-weight:600;color:#dc2626">✗ 图片不存在</div>
              <div style="font-family:monospace;font-size:13px;margin-top:4px">${mac} → ${key}</div>
            </div>`;
        }
      } catch(e) {
        resultEl.innerHTML = `<div style="color:#dc2626">查询失败: ${e.message}</div>`;
      }
    }

    // ============ 查询 R2 文件列表 ============
    let r2Files = []; // { key, mac, url }

    async function listR2Files() {
      const cfg = getR2Config();
      if (!cfg.accountId || !cfg.bucket || !cfg.publicUrl) {
        showToast("请先配置 R2 存储", true);
        return;
      }

      const statusEl = document.getElementById("r2-list-status");
      statusEl.textContent = "查询中...";
      r2Files = [];

      try {
        const cfToken = document.getElementById("r2-cf-token").value.trim() || "";
        let cursor = "";
        do {
          let url = "https://api.cloudflare.com/client/v4/accounts/" + cfg.accountId + "/r2/buckets/" + cfg.bucket + "/objects?per_page=1000";
          if (cursor) url += "&cursor=" + encodeURIComponent(cursor);

          const resp = await fetch(url, {
            headers: { "Authorization": "Bearer " + cfToken }
          });
          if (!resp.ok) throw new Error("请求失败 (" + resp.status + ")");

          const data = await resp.json();
          if (!data.success) throw new Error(data.errors[0]?.message || "查询失败");

          (data.result || []).forEach(obj => {
            const key = obj.key;
            const match = key.match(/([0-9A-Fa-f]{2}[_:-]){5}[0-9A-Fa-f]{2}/);
            const mac = match ? normalizeMac(match[0].replace(/_/g, ":")) : "";
            r2Files.push({ key, mac, url: cfg.publicUrl + "/" + key });
          });

          cursor = data.result?.truncated ? (data.result?.cursor || "") : "";
        } while (cursor);

        statusEl.textContent = "共 " + r2Files.length + " 个文件";
        renderR2Files();
      } catch (e) {
        statusEl.textContent = "查询失败: " + e.message;
        showToast(e.message, true);
      }
    }

    function renderR2Files() {
      const container = document.getElementById("r2-file-list");
      const actions = document.getElementById("r2-list-actions");
      if (r2Files.length === 0) {
        container.style.display = "";
        container.innerHTML = "<div class='empty'>暂无文件</div>";
        actions.style.display = "none";
        return;
      }
      container.style.display = "";
      actions.style.display = "";
      container.innerHTML = r2Files.map((f, i) => `
        <div class="result-item">
          <span class="result-mac">${f.mac || '(无MAC)'}</span>
          <span class="result-link" style="font-size:11px">${f.key}</span>
          <div class="result-actions">
            <a href="${f.url}" target="_blank" class="btn btn-secondary btn-sm" style="text-decoration:none">查看</a>
          </div>
        </div>
      `).join("");
    }

    function copyAllMacs() {
      const text = r2Files.filter(f => f.mac).map(f => f.mac).join("\n");
      navigator.clipboard.writeText(text);
      showToast("已复制 " + r2Files.filter(f => f.mac).length + " 个 MAC");
    }

    function exportMacsCSV() {
      let csv = "MAC,文件名,链接\n";
      r2Files.forEach(f => {
        csv += `"${f.mac}","${f.key}","${f.url}"\n`;
      });
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "R2图片列表.csv";
      a.click();
    }

    async function uploadAll() {
      const cfg = getR2Config();
      if (!cfg.accountId || !cfg.accessKeyId || !cfg.secretAccessKey || !cfg.bucket || !cfg.publicUrl) {
        showToast("请先配置 R2 存储", true);
        return;
      }

      for (let i = 0; i < pendingFiles.length; i++) {
        const entry = pendingFiles[i];
        const card = document.getElementById("preview-" + i);
        const statusEl = card.querySelector(".status");
        statusEl.textContent = "上传中...";
        statusEl.className = "status status-wait";

        try {
          const objectKey = entry.filename;
          await uploadToR2(entry.file, objectKey);
          statusEl.textContent = "✓ 上传成功";
          statusEl.className = "status status-ok";
        } catch (e) {
          statusEl.textContent = "✗ " + e.message;
          statusEl.className = "status status-err";
        }
      }

      showToast("上传完成");
    }

    // ============ Toast ============
    function showToast(msg, isErr) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast show " + (isErr ? "toast-err" : "toast-ok");
      setTimeout(() => el.className = "toast", 3000);
    }
  </script>
</body>
</html>
