<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>下载 App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 尝试唤起 App 时显示过渡提示 */
    body.trying-app .card { display: none; }
    body.trying-app::after {
      content: "正在打开应用...";
      color: #fff;
      font-size: 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }

    .btn:active { transform: scale(0.97); }

    .btn-app {
      background: #1a1a2e;
      color: #fff;
      box-shadow: 0 4px 15px rgba(26, 26, 46, 0.3);
    }

    .btn-icon { width: 24px; height: 24px; flex-shrink: 0; }

    .qr-section {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid #eee;
    }

    .qr-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .qr-desc {
      font-size: 13px;
      color: #999;
      margin-bottom: 16px;
    }

    .qr-placeholder {
      width: 180px;
      height: 180px;
      border: 2px dashed #ddd;
      border-radius: 12px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 13px;
      background: #fafafa;
      overflow: hidden;
    }

    .qr-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🚀</div>
    <div class="title">恒捷蓝牙遥控</div>
    <div class="subtitle">选择你想要的方式打开</div>

    <!-- 下载 App 按钮 -->
    <a href="#" class="btn btn-app">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-1.55 4.28-3.74 4.25z"/>
      </svg>
      下载 App
    </a>

    <!-- 小程序码区域 -->
    <div class="qr-section">
      <div class="qr-title">微信扫码打开小程序</div>
      <div class="qr-desc">用微信扫一扫，直接打开小程序</div>
      <div class="qr-placeholder" id="qr-code">
        <span>小程序码占位</span>
      </div>
    </div>

    <div class="footer">© 2026 恒捷蓝牙遥控 · All Rights Reserved</div>
  </div>

  <script>
    const CONFIG = {
      // App 自定义 URL Scheme（已安装时直接唤起）
      appScheme: "cyblerc://pages/index/index",

      // App 下载链接
      appUrl: "https://apps.apple.com/cn/app/id6751023871",
      iosUrl: "",
      androidUrl: "",

      // 二维码图片基础地址（GitHub Releases）
      // 图片命名格式：mac 地址冒号替换为下划线，如 98_DA_B0_10_51_33.png
      qrBaseUrl: "https://pub-eedaa9e3aef043f7a662a6870ce08bc0.r2.dev"
    };

    const ua = navigator.userAgent.toLowerCase();
    const isIOS = /iphone|ipad|ipod/.test(ua);
    const isAndroid = /android/.test(ua);
    const urlParams = new URLSearchParams(window.location.search);
    const mac = urlParams.get("mac") || "";

    function appendMac(url) {
      if (!url || !mac) return url;
      const sep = url.includes("?") ? "&" : "?";
      return url + sep + "mac=" + encodeURIComponent(mac);
    }

    /*
     * 尝试自动唤起 App
     */
    let appOpened = false;

    function tryOpenApp() {
      if (!CONFIG.appScheme) return;

      document.body.classList.add("trying-app");

      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = appendMac(CONFIG.appScheme);
      document.body.appendChild(iframe);

      function onVisibilityChange() {
        if (document.hidden || document.visibilityState === "hidden") {
          appOpened = true;
          cleanup();
        }
      }

      function cleanup() {
        document.removeEventListener("visibilitychange", onVisibilityChange);
        window.removeEventListener("pagehide", onPageHide);
        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
      }

      function onPageHide() {
        appOpened = true;
        cleanup();
      }

      document.addEventListener("visibilitychange", onVisibilityChange);
      window.addEventListener("pagehide", onPageHide);

      setTimeout(() => {
        cleanup();
        if (!appOpened) {
          document.body.classList.remove("trying-app");
        }
      }, 2000);
    }

    tryOpenApp();

    /*
     * 设置 App 下载链接
     */
    const appBtn = document.querySelector(".btn-app");
    let appDownloadUrl = CONFIG.appUrl;
    if (isIOS && CONFIG.iosUrl) appDownloadUrl = CONFIG.iosUrl;
    if (isAndroid && CONFIG.androidUrl) appDownloadUrl = CONFIG.androidUrl;
    appBtn.href = appendMac(appDownloadUrl);

    // 副标题显示 mac
    if (mac) {
      document.querySelector(".subtitle").textContent = "设备: " + mac;
    }

    /*
     * 小程序码：从 GitHub Releases 加载
     * 图片命名：mac 地址冒号替换为下划线，如 98_DA_B0_10_51_33.png
     */
    const qrContainer = document.getElementById("qr-code");
    if (mac) {
      const qrFile = mac.replace(/:/g, "_") + ".jpg";
      const qrUrl = CONFIG.qrBaseUrl + "/" + qrFile;
      const img = new Image();
      img.onload = function() {
        qrContainer.innerHTML = "";
        qrContainer.appendChild(img);
      };
      img.onerror = function() {
        qrContainer.innerHTML = "<span style='color:#e74c3c'>未找到此设备的二维码</span>";
      };
      img.src = qrUrl;
      img.alt = "小程序码 - " + mac;
    } else {
      qrContainer.innerHTML = "<span>请携带 mac 参数访问</span>";
    }
  </script>
</body>
</html>
