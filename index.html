<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>下载 App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }

    .btn:active { transform: scale(0.97); }

    .btn-app {
      background: #1a1a2e;
      color: #fff;
      box-shadow: 0 4px 15px rgba(26, 26, 46, 0.3);
    }

    .btn-icon { width: 24px; height: 24px; flex-shrink: 0; }

    .qr-section {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid #eee;
    }

    .qr-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .qr-desc {
      font-size: 13px;
      color: #999;
      margin-bottom: 16px;
    }

    .qr-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
    }

    .qr-placeholder {
      width: 180px;
      height: 180px;
      border: 2px dashed #ddd;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 13px;
      background: #fafafa;
      overflow: hidden;
    }

    .qr-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 半透明遮罩 */
    .qr-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .qr-overlay span {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.6;
      text-align: center;
      padding: 0 12px;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #ccc;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      max-width: 300px;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🚀</div>
    <div class="title">恒捷蓝牙遥控</div>
    <div class="subtitle">选择你想要的方式打开</div>

    <a href="#" class="btn btn-app" id="btn-app">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-1.55 4.28-3.74 4.25z"/>
      </svg>
      下载 App
    </a>

    <div class="qr-section">
      <div class="qr-title">微信扫码打开小程序</div>
      <div class="qr-desc" id="qr-desc">用微信扫一扫，直接打开小程序</div>
      <div class="qr-wrapper">
        <div class="qr-placeholder" id="qr-code">
          <span>小程序码占位</span>
        </div>
        <!-- 非微信浏览器时显示遮罩 -->
        <div class="qr-overlay" id="qr-overlay" style="display:none">
          <span>请在微信中<br>扫码打开小程序</span>
        </div>
      </div>
    </div>

    <div class="footer">© 2026 恒捷蓝牙遥控 · All Rights Reserved</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CONFIG = {
      appScheme: "cyblerc://pages/index/index",
      appUrl: "https://apps.apple.com/cn/app/id6751023871",
      iosUrl: "",
      androidUrl: "",
      qrBaseUrl: "https://pub-eedaa9e3aef043f7a662a6870ce08bc0.r2.dev"
    };

    function encodeMac(mac) {
      const reversed = mac.split("").reverse().join("");
      return btoa(reversed).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodeMac(encoded) {
      let s = encoded.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      return atob(s).split("").reverse().join("");
    }

    const ua = navigator.userAgent.toLowerCase();
    const isIOS = /iphone|ipad|ipod/.test(ua);
    const isAndroid = /android/.test(ua);
    const isWeChat = /micromessenger/.test(ua);
    const urlParams = new URLSearchParams(window.location.search);

    let mac = "";
    const d = urlParams.get("d");
    if (d) {
      try { mac = decodeMac(d); } catch(e) { mac = ""; }
    }
    if (!mac) mac = urlParams.get("mac") || "";

    function appendMac(url) {
      if (!url || !mac) return url;
      const sep = url.includes("?") ? "&" : "?";
      return url + sep + "mac=" + encodeURIComponent(mac);
    }

    function showToast(msg, duration) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), duration || 2500);
    }

    // ============ 微信浏览器 ============
    const appBtn = document.getElementById("btn-app");

    if (isWeChat) {
      // 微信内：拦截下载，提示用浏览器打开
      appBtn.addEventListener("click", function(e) {
        e.preventDefault();
        showToast("长按下方二维码进入小程序\n下载请用浏览器打开本页");
      });
    } else {
      // 非微信：点击下载按钮 → 先尝试唤起 App，失败再跳 App Store
      appBtn.addEventListener("click", function(e) {
        e.preventDefault();
        tryOpenAppThenFallback();
      });
    }

    // ============ 非微信：小程序码加遮罩 ============
    if (!isWeChat) {
      document.getElementById("qr-desc").style.display = "none";
      document.getElementById("qr-overlay").style.display = "flex";
    }

    // ============ 普通浏览器：唤起 App 逻辑 ============
    function tryOpenAppThenFallback() {
      if (!CONFIG.appScheme) {
        window.location.href = appendMac(CONFIG.appUrl);
        return;
      }

      const schemeUrl = appendMac(CONFIG.appScheme);
      let appOpened = false;

      // 页面隐藏 = App 已打开
      function onHide() {
        appOpened = true;
        cleanup();
      }
      function cleanup() {
        document.removeEventListener("visibilitychange", onHide);
        window.removeEventListener("pagehide", onHide);
      }
      document.addEventListener("visibilitychange", onHide);
      window.addEventListener("pagehide", onHide);

      window.location.href = schemeUrl;

      // 超时后：不自动跳，显示手动下载按钮
      setTimeout(() => {
        cleanup();
        if (!appOpened) {
          let fallbackUrl = CONFIG.appUrl;
          if (isIOS && CONFIG.iosUrl) fallbackUrl = CONFIG.iosUrl;
          if (isAndroid && CONFIG.androidUrl) fallbackUrl = CONFIG.androidUrl;
          fallbackUrl = appendMac(fallbackUrl);
          appBtn.innerHTML = "📦 前往 App Store 下载";
          appBtn.href = fallbackUrl;
          appBtn.onclick = null;
        }
      }, 3000);
    }

    // 副标题显示 mac
    if (mac) {
      document.querySelector(".subtitle").textContent = "设备: " + mac;
    }

    // 小程序码图片
    const qrContainer = document.getElementById("qr-code");
    if (mac) {
      const qrFile = mac.replace(/:/g, "_") + ".jpg";
      const qrUrl = CONFIG.qrBaseUrl + "/" + qrFile;
      const img = new Image();
      img.onload = function() {
        qrContainer.innerHTML = "";
        qrContainer.appendChild(img);
      };
      img.onerror = function() {
        qrContainer.innerHTML = "<span style='color:#e74c3c'>未找到此设备的二维码</span>";
      };
      img.src = qrUrl;
      img.alt = "小程序码";
    } else {
      qrContainer.innerHTML = "<span>请携带参数访问</span>";
    }
  </script>
</body>
</html>
