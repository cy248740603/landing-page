<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>下载 App / 打开小程序</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 尝试跳转时隐藏页面内容，避免闪烁 */
    body.trying-app .card { display: none; }
    body.trying-app::after {
      content: "正在打开应用...";
      color: #fff;
      font-size: 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      margin-bottom: 14px;
    }

    .btn:active { transform: scale(0.97); }

    .btn-wechat {
      background: #07C160;
      color: #fff;
      box-shadow: 0 4px 15px rgba(7, 193, 96, 0.3);
    }

    .btn-app {
      background: #1a1a2e;
      color: #fff;
      box-shadow: 0 4px 15px rgba(26, 26, 46, 0.3);
    }

    .btn-icon { width: 24px; height: 24px; flex-shrink: 0; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #ccc;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px; background: #eee;
    }

    .qr-section { margin-top: 10px; }
    .qr-placeholder {
      width: 160px; height: 160px;
      border: 2px dashed #ddd;
      border-radius: 12px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 13px;
      background: #fafafa;
    }
    .qr-hint { font-size: 12px; color: #aaa; }
    .footer { margin-top: 30px; font-size: 12px; color: #ccc; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🚀</div>
    <div class="title">我的应用</div>
    <div class="subtitle">选择你想要的方式打开</div>

    <a href="#" class="btn btn-wechat">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05a6.56 6.56 0 0 1-.253-1.82c0-3.58 3.39-6.49 7.57-6.49.258 0 .51.013.761.036C16.708 4.393 13.065 2.188 8.691 2.188zm-3.11 5.06a1.06 1.06 0 1 1 0-2.12 1.06 1.06 0 0 1 0 2.12zm5.59 0a1.06 1.06 0 1 1 0-2.12 1.06 1.06 0 0 1 0 2.12z"/>
        <path d="M23.997 14.637c0-3.36-3.39-6.09-7.57-6.09s-7.57 2.73-7.57 6.09 3.39 6.09 7.57 6.09c.87 0 1.71-.14 2.49-.39a.72.72 0 0 1 .6.08l1.57.92a.27.27 0 0 0 .14.04c.13 0 .24-.11.24-.24 0-.06-.02-.12-.04-.17l-.32-1.23a.49.49 0 0 1 .18-.55c1.52-1.12 2.71-2.82 2.71-4.55zM14.357 13.4a.88.88 0 1 1 0-1.76.88.88 0 0 1 0 1.76zm4.68 0a.88.88 0 1 1 0-1.76.88.88 0 0 1 0 1.76z"/>
      </svg>
      微信小程序打开
    </a>

    <a href="#" class="btn btn-app">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-1.55 4.28-3.74 4.25z"/>
      </svg>
      下载 App
    </a>

    <div class="divider">或扫码</div>

    <div class="qr-section">
      <div class="qr-placeholder" id="qr-code">
        <span>二维码占位</span>
      </div>
      <div class="qr-hint">用微信扫码，可直接打开小程序</div>
    </div>

    <div class="footer">© 2026 我的应用 · All Rights Reserved</div>
  </div>

  <!-- 可选：引入 qrcode.js 自动生成二维码 -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script> -->
  <script>
    /*
     * ============================
     *   配 置 区 — 替换成你的真实链接
     * ============================
     */
    const CONFIG = {
      // 小程序 appid
      miniAppId: "wxe5dce50030c88a4e",

      // 小程序页面路径
      miniPath: "pages/index/index",

      // App 自定义 URL Scheme（已安装时直接唤起 App）
      // 例: "myapp://open"  "myapp://device/bind"
      // 留空则不尝试自动唤起
      appScheme: "cyblerc://pages/index/index",

      // App 下载链接
      appUrl: "https://apps.apple.com/app/%E6%81%92%E6%8D%B7%E8%93%9D%E7%89%99%E9%81%A5%E6%8E%A7/id6751023871",
      iosUrl: "",       // iOS 专用（可选）
      androidUrl: "",   // Android 专用（可选）

      // 二维码内容（落地页地址或小程序码链接）
      qrContent: "https://your-landing-page.com"
    };

    /*
     * 公共变量
     */
    const ua = navigator.userAgent.toLowerCase();
    const isIOS = /iphone|ipad|ipod/.test(ua);
    const isAndroid = /android/.test(ua);
    const urlParams = new URLSearchParams(window.location.search);
    const mac = urlParams.get("mac") || "";

    function appendMac(url) {
      if (!url || !mac) return url;
      const sep = url.includes("?") ? "&" : "?";
      return url + sep + "mac=" + encodeURIComponent(mac);
    }

    /*
     * ============================
     *   尝试自动唤起 App
     *   如果已安装 → 直接跳走
     *   如果未安装 → 超时后显示选择页面
     * ============================
     */
    let appOpened = false;

    function tryOpenApp() {
      if (!CONFIG.appScheme) return;

      document.body.classList.add("trying-app");

      // 记录页面隐藏时间，用于判断 App 是否被唤起
      const start = Date.now();

      // 用隐藏 iframe 尝试唤起，不替换当前页面
      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = appendMac(CONFIG.appScheme);
      document.body.appendChild(iframe);

      // 监听页面是否被隐藏（App 唤起后浏览器会进入后台）
      function onVisibilityChange() {
        if (document.hidden || document.visibilityState === "hidden") {
          appOpened = true;
          cleanup();
        }
      }

      function cleanup() {
        document.removeEventListener("visibilitychange", onVisibilityChange);
        window.removeEventListener("pagehide", onPageHide);
        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
      }

      function onPageHide() {
        appOpened = true;
        cleanup();
      }

      document.addEventListener("visibilitychange", onVisibilityChange);
      window.addEventListener("pagehide", onPageHide);

      // 2 秒后如果 App 没被唤起，显示选择页面
      setTimeout(() => {
        cleanup();
        if (!appOpened) {
          document.body.classList.remove("trying-app");
        }
      }, 2000);
    }

    // 页面加载后立即尝试唤起
    tryOpenApp();

    /*
     * ============================
     *   设置链接
     * ============================
     */

    // --- 小程序 ---
    const wechatBtn = document.querySelector(".btn-wechat");
    const miniPathWithMac = CONFIG.miniPath + (mac ? "?mac=" + encodeURIComponent(mac) : "");
    wechatBtn.href = "weixin://dl/business/?appid=" + CONFIG.miniAppId + "&path=" + encodeURIComponent(miniPathWithMac);

    // --- App 下载 ---
    const appBtn = document.querySelector(".btn-app");
    let appDownloadUrl = CONFIG.appUrl;
    if (isIOS && CONFIG.iosUrl) appDownloadUrl = CONFIG.iosUrl;
    if (isAndroid && CONFIG.androidUrl) appDownloadUrl = CONFIG.androidUrl;
    appBtn.href = appendMac(appDownloadUrl);

    // 页面副标题显示 mac（方便调试）
    if (mac) {
      document.querySelector(".subtitle").textContent = "设备: " + mac;
    }

    /*
     * 生成二维码（取消注释 qrcode.js 引入后启用）
     */
    // new QRCode(document.getElementById("qr-code"), {
    //   text: CONFIG.qrContent + (mac ? "?mac=" + encodeURIComponent(mac) : ""),
    //   width: 156, height: 156,
    //   colorDark: "#1a1a2e", colorLight: "#ffffff",
    //   correctLevel: QRCode.CorrectLevel.M
    // });
  </script>
</body>
</html>
